version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: kitlabs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-kitlabs}
      POSTGRES_MULTIPLE_DATABASES: ${DB_NAME:-kitlabs},${MAIN_DB_NAME:-kitlabs_platform},${TOOL_DB_NAME:-kitlabs_tools},${AUDIT_DB_NAME:-kitlabs_audit},${FILM_DB_NAME:-kitlabs_film}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-create-databases.sh:ro

  redis:
    image: redis:7
    container_name: kitlabs-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  ytdlp:
    build: ./tools/yt-dlp-service
    container_name: kitlabs-ytdlp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8000"
    volumes:
      - ytdlp_temp:/tmp/ytdlp
    environment:
      - MAX_CONCURRENT_DOWNLOADS=3

  douyin-playwright:
    build: ./tools/douyin-playwright-service
    container_name: kitlabs-douyin-playwright
    restart: unless-stopped
    ports:
      - "127.0.0.1:8101:8000"
    environment:
      - PORT=8000
    shm_size: "1gb"
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  pg_data:
  redis_data:
  ytdlp_temp:
