    <!-- Palm -->
    <ellipse cx="50" cy="65" rx="20" ry="18" fill="#f5deb3"/>
    <!-- Fingers -->
    <rect x="30" y="35" width="11" height="28" rx="5" fill="#f5deb3"/>
    <rect x="43" y="28" width="11" height="32" rx="5" fill="#f5deb3"/>
    <rect x="56" y="30" width="11" height="30" rx="5" fill="#f5deb3"/>
    <rect x="69" y="36" width="10" height="25" rx="5" fill="#f5deb3"/>
    <!-- Thumb -->
    <rect x="20" y="52" width="14" height="10" rx="5" fill="#f5deb3" transform="rotate(-30, 27, 57)"/>
    <!-- Marker pen -->
    <rect x="44" y="5" width="7" height="30" rx="3" fill="#222"/>
    <polygon points="44,35 51,35 47.5,48" fill="#222"/>
    <rect x="44" y="5" width="7" height="8" rx="2" fill="#e74c3c"/>
